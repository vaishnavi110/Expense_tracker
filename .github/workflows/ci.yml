name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/reusable-node-test.yml
    with:
      working-directory: backend
      node-versions: '[18, 20, 22]'

  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/reusable-node-test.yml
    with:
      working-directory: frontend
      node-versions: '[18, 20, 22]'

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React app
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-frontend, verify-artifact]
    if: failure()

    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: *CI failed* in ${REPO} on branch ${BRANCH} (by ${ACTOR})\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

  verify-artifact:
    name: Verify Downloaded Artifact
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: downloaded-build/

      - name: List downloaded files
        run: ls -la downloaded-build/

      